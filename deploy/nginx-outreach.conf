# /etc/nginx/sites-available/outreach.customania.com.co
# Server block APARTE del que ya usas para customania.com.co (no lo toca).
# Los certificados los gestiona certbot (certbot --nginx -d outreach.customania.com.co).
server {
    listen 443 ssl http2;
    server_name outreach.customania.com.co;
    # ssl_certificate ...; ssl_certificate_key ...;   <- los agrega certbot

    client_max_body_size 5m;

    location / {
        proxy_pass http://127.0.0.1:4322;   # mismo puerto que PORT en el .env de esta app
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # $remote_addr (no $proxy_add_x_forwarded_for) para que nadie falsifique su IP y evada el límite de intentos de login
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    # Capa extra opcional: solo tu IP puede llegar a la app
    # allow TU.IP.PUBLICA; deny all;
}

server {
    listen 80;
    server_name outreach.customania.com.co;
    location / { return 301 https://$host$request_uri; }
}
